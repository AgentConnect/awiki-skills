[project]
name = "awiki-did"
version = "1.0.0"
description = "DID 去中心化身份交互 Skill - 身份管理、消息通信、社交关系、E2EE 加密"
requires-python = ">=3.10"
dependencies = [
    "anp>=0.5.3",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
